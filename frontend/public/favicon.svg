<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    Foundry mark — "The Pour"
    Abstract mold gate: molten core radiating into runner channels.
    Reads as forge heat + modular panel nodes at small sizes.
  -->
  <defs>
    <linearGradient id="crucible" x1="10" y1="8" x2="22" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="shell" x1="4" y1="3" x2="28" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f766e"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#shell)"/>

  <!-- Outer runner ring (mold cavity) -->
  <circle cx="16" cy="16" r="10" stroke="#5eead4" stroke-width="1.35" opacity="0.55"/>

  <!-- Three pour runners → terminal nodes (120°) -->
  <g fill="#99f6e4">
    <path d="M16 7.2 L17.15 12.1 A4.6 4.6 0 0 0 14.85 12.1 Z"/>
    <path d="M23.9 20.8 L19.15 18.85 A4.6 4.6 0 0 0 20.25 16.85 Z"/>
    <path d="M8.1 20.8 L11.75 16.85 A4.6 4.6 0 0 0 12.85 18.85 Z"/>
  </g>

  <!-- Terminal pads -->
  <circle cx="16" cy="6.4" r="1.55" fill="#fbbf24"/>
  <circle cx="24.7" cy="21.6" r="1.55" fill="#38bdf8"/>
  <circle cx="7.3" cy="21.6" r="1.55" fill="#a3e635"/>

  <!-- Molten core -->
  <circle cx="16" cy="16" r="4.2" fill="url(#crucible)"/>
  <circle cx="14.7" cy="14.6" r="1.2" fill="#fff7ed" opacity="0.55"/>
</svg>
